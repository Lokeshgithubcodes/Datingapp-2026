name: Build and Deploy ASP.NET Core + Angular App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Install Angular cli
        run: npm install -g @angular/cli@21.1.4

      - name: Install deps and build angular app
        run: |
          cd client
          npm install
          ng build

      
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      # ✅ Restore
      - name: Restore .NET
        run: dotnet restore API/API.csproj

      # ✅ Build
      - name: Build .NET
        run: dotnet build API/API.csproj --configuration Release --no-restore

      # ✅ Publish
      - name: Publish .NET
        run: dotnet publish API/API.csproj --configuration Release --output ./publish

      # ✅ Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      # ✅ Download artifact
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: .

      # ✅ Azure Login
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C040F7B6C6164D8BBAAE97AAF7166CB3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_773F6DBF295945719406630DBDAF6229 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D8774A25B2A3491084C0FFFEBF58C8FE }}

      # ✅ Deploy
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'da-130604'
          slot-name: 'Production'
          package: .